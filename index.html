<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTools Pro | 开发者工具箱</title>
    <style>
        :root[data-theme="light"] {
            --bg-main: #f6f8fa;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --border-color: #d0d7de;
            --text-main: #24292f;
            --text-muted: #57606a;
            --accent-color: #0969da;
            --glow-shadow: 
                0 0 0 2px rgba(9, 105, 218, 0.1),
                0 0 12px rgba(9, 105, 218, 0.2),
                0 0 25px rgba(9, 105, 218, 0.1);
            --btn-bg: #f3f4f6;
            --header-bg: rgba(255, 255, 255, 0.8);
        }

        :root[data-theme="dark"] {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --bg-input: #010409;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-color: #2f81f7;
            --glow-shadow: 
                0 0 0 2px rgba(47, 129, 247, 0.2),
                0 0 15px rgba(47, 129, 247, 0.3),
                0 0 35px rgba(47, 129, 247, 0.15);
            --btn-bg: #21262d;
            --header-bg: rgba(13, 17, 23, 0.8);
        }

        * { box-sizing: border-box; transition: background 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s; }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 0 24px;
            height: 60px;
            background-color: var(--header-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .logo { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .logo svg { fill: var(--accent-color); }

        .toolbar { 
            display: flex; 
            gap: 8px; 
            padding: 12px 24px; 
            background: var(--bg-card); 
            border-bottom: 1px solid var(--border-color);
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            cursor: pointer;
            font-size: 13px;
            padding: 6px 14px;
        }

        .btn:hover { border-color: var(--text-muted); }
        .btn-primary { background-color: #238636; color: #fff; border: none; }

        main { flex: 1; display: flex; padding: 24px; gap: 24px; overflow: hidden; }

        .editor-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .editor-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
        }

        /* 编辑器容器 */
        textarea {
            flex: 1;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 13px;
            padding: 16px;
            background-color: var(--bg-input);
            color: var(--text-main);
            /* 基础边框 */
            border: 1px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            resize: none;
            line-height: 1.6;
            /* 顺滑过渡 */
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
        }

        textarea:focus {
            border-color: var(--accent-color);
            box-shadow: var(--glow-shadow);
            transform: translateY(-1px); /* 微小的悬浮感 */
        }

        footer {
            padding: 12px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 768px) { 
            main { flex-direction: column; overflow-y: auto; }
            textarea { min-height: 260px; }
        }
    </style>
</head>
<body data-theme="dark">

<header>
    <div class="logo">
        <svg height="24" viewBox="0 0 16 16" width="24"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
        <span>DevTools Pro</span>
    </div>
    <div class="controls">
        <button class="btn" onclick="toggleLanguage()" id="langBtn">English</button>
        <button class="btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>
</header>

<div class="toolbar">
    <button class="btn" onclick="formatJSON()" data-i18n="formatJson">格式化 JSON</button>
    <button class="btn" onclick="minifyCSS()" data-i18n="minifyCss">压缩 CSS</button>
    <button class="btn" onclick="prettifySQL()" data-i18n="prettifySql">SQL 美化</button>
    <button class="btn btn-primary" onclick="copyOutput()" data-i18n="copy">复制结果</button>
</div>

<main>
    <div class="editor-wrapper">
        <div class="editor-label">
            <span data-i18n="inputTitle">输入</span>
            <div style="display:flex; gap:4px"><span style="width:6px;height:6px;border-radius:50%;background:#ff5f56"></span><span style="width:6px;height:6px;border-radius:50%;background:#ffbd2e"></span><span style="width:6px;height:6px;border-radius:50%;background:#27c93f"></span></div>
        </div>
        <textarea id="inputArea" spellcheck="false" placeholder="Paste here..."></textarea>
    </div>

    <div class="editor-wrapper">
        <div class="editor-label">
            <span data-i18n="outputTitle">输出</span>
            <span id="statusTag" style="color: var(--accent-color); font-size: 9px; opacity: 0;">DONE</span>
        </div>
        <textarea id="outputArea" spellcheck="false" readonly placeholder="Output..."></textarea>
    </div>
</main>

<footer>
    &copy; <span id="current-year"></span> DevTools Pro &bull; Local Processing
</footer>

<script>
    document.getElementById("current-year").textContent =
        new Date().getFullYear();
    
    const i18n = {
        zh: {
            formatJson: "格式化 JSON",
            minifyCss: "压缩 CSS",
            prettifySql: "SQL 美化",
            copy: "复制结果",
            inputTitle: "源代码",
            outputTitle: "处理结果",
            langBtn: "English",
            copied: "已复制！",
            invalid: "无效格式"
        },
        en: {
            formatJson: "Format JSON",
            minifyCss: "Minify CSS",
            prettifySql: "SQL Prettify",
            copy: "Copy",
            inputTitle: "SOURCE",
            outputTitle: "RESULT",
            langBtn: "中文",
            copied: "Copied!",
            invalid: "Invalid"
        }
    };

    let currentLang = localStorage.getItem('lang') || 'zh';
    let currentTheme = localStorage.getItem('theme') || 'dark';

    function init() {
        document.documentElement.setAttribute('data-theme', currentTheme);
        updateUI();
    }

    function toggleTheme() {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
        updateUI();
        localStorage.setItem('theme', currentTheme);
    }

    function toggleLanguage() {
        currentLang = currentLang === 'zh' ? 'en' : 'zh';
        localStorage.setItem('lang', currentLang);
        updateUI();
    }

    function updateUI() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.textContent = i18n[currentLang][el.getAttribute('data-i18n')];
        });
        document.getElementById('langBtn').textContent = i18n[currentLang].langBtn;
        document.getElementById('themeBtn').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
    }

    function showStatus() {
        const tag = document.getElementById('statusTag');
        tag.style.opacity = 1;
        setTimeout(() => tag.style.opacity = 0, 1000);
    }

    function formatJSON() {
        try {
            const val = document.getElementById('inputArea').value;
            if(!val) return;
            document.getElementById('outputArea').value = JSON.stringify(JSON.parse(val), null, 4);
            showStatus();
        } catch (e) {
            document.getElementById('outputArea').value = i18n[currentLang].invalid + ": " + e.message;
        }
    }

    function minifyCSS() {
        const css = document.getElementById('inputArea').value;
        if(!css) return;
        document.getElementById('outputArea').value = css.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\s+/g, ' ').replace(/\s*([{}:;,])\s*/g, '$1').trim();
        showStatus();
    }

    function prettifySQL() {
        const sql = document.getElementById('inputArea').value;
        if(!sql) return;
        const keywords = ["SELECT", "FROM", "WHERE", "AND", "JOIN", "UPDATE", "SET", "DELETE"];
        let formatted = sql.replace(/\s+/g, ' ');
        keywords.forEach(kw => {
            formatted = formatted.replace(new RegExp(`\\b${kw}\\b`, 'gi'), `\n${kw.toUpperCase()}`);
        });
        document.getElementById('outputArea').value = formatted.trim();
        showStatus();
    }

    async function copyOutput() {
        const out = document.getElementById('outputArea');
        if (!out.value) return;
        await navigator.clipboard.writeText(out.value);
        const btn = document.querySelector('[data-i18n="copy"]');
        const oldText = i18n[currentLang].copy;
        btn.textContent = i18n[currentLang].copied;
        setTimeout(() => btn.textContent = oldText, 2000);
    }

    init();
</script>
</body>
</html>
